<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle Island</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:#123;color:#fff}#menu{height:100%;display:grid;place-items:center;background:linear-gradient(#245b80,#101827)}.box{width:min(460px,90%);padding:28px;background:#101b2ccc;border-radius:20px;text-align:center}button{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:10px;background:#ffd447;font-weight:bold;font-size:17px;cursor:pointer}#game{display:none}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:12px;left:12px;padding:12px 16px;background:#07111dcc;border-radius:10px;font-weight:bold}</style></head>
<body>
<div id="menu"><div class="box"><h1>Battle Island</h1><p>Choose a mode</p>
<button onclick="start('single')">Single Player</button><button onclick="start('duos')">Duos</button><button onclick="start('trios')">Trios</button><button onclick="start('quads')">Quads</button><button onclick="start('blitz')">Blitz</button>
<p>Single Player is playable against computer players.</p></div></div>
<div id="game"><canvas id="c"></canvas><div id="hud">Health: <b id="hp">100</b><br>XP: <b id="xp">0</b><br>Eliminations: <b id="el">0</b><br>Mode: <b id="mode">Single Player</b></div></div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d'),W,H,p,b=[],shots=[],keys={},mouse={x:0,y:0,down:false},hp=100,xp=0,el=0,running=false,last=0,cool=0;
function size(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',size);size();
addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});
c.onmousemove=function(e){mouse.x=e.clientX;mouse.y=e.clientY};c.onmousedown=function(){mouse.down=1};addEventListener('mouseup',function(){mouse.down=0});
function start(mode){document.getElementById('menu').style.display='none';document.getElementById('game').style.display='block';document.getElementById('mode').textContent=mode==='single'?'Single Player':mode.toUpperCase();hp=100;xp=0;el=0;shots=[];b=[];p={x:W/2,y:H/2};var n=mode==='blitz'?29:12;for(var i=0;i<n;i++){var a=Math.random()*6.28,d=180+Math.random()*350;b.push({x:W/2+Math.cos(a)*d,y:H/2+Math.sin(a)*d,h:30,s:50+Math.random()*40,t:0})}running=true;last=performance.now();requestAnimationFrame(loop)}
function fire(){if(cool>0)return;var a=Math.atan2(mouse.y-p.y,mouse.x-p.x);shots.push({x:p.x,y:p.y,vx:Math.cos(a)*650,vy:Math.sin(a)*650,l:1});cool=.18}
function end(win){running=false;alert(win?'You cleared Battle Island!':'Round over. XP: '+xp+'  Eliminations: '+el);location.reload()}
function loop(now){if(!running)return;var dt=Math.min(.03,(now-last)/1000);last=now;cool-=dt;
var dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.hypot(dx,dy)||1;p.x=Math.max(25,Math.min(W-25,p.x+dx/m*260*dt));p.y=Math.max(25,Math.min(H-25,p.y+dy/m*260*dt));if(mouse.down)fire();
shots.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;b.forEach(function(o){if(o.h<=0)return;if(Math.hypot(q.x-o.x,q.y-o.y)<22){o.h=0;q.l=0;el++;xp+=25}})});shots=shots.filter(function(q){return q.l>0});
b.forEach(function(o){if(o.h<=0)return;var a=Math.atan2(p.y-o.y,p.x-o.x);o.x+=Math.cos(a)*o.s*dt;o.y+=Math.sin(a)*o.s*dt;o.t-=dt;if(Math.hypot(p.x-o.x,p.y-o.y)<38&&o.t<=0){hp-=8;o.t=1}});
b=b.filter(function(o){return o.h>0});if(hp<=0)return end(false);if(!b.length)return end(true);
x.fillStyle='#4b9ed1';x.fillRect(0,0,W,H);x.fillStyle='#78bd5c';x.beginPath();x.ellipse(W/2,H/2,W*.43,H*.4,0,0,6.28);x.fill();
x.strokeStyle='#b99a66';x.lineWidth=24;x.beginPath();x.moveTo(W*.12,H/2);x.lineTo(W*.88,H/2);x.stroke();x.beginPath();x.moveTo(W/2,H*.12);x.lineTo(W/2,H*.88);x.stroke();
b.forEach(function(o){x.fillStyle='#ff6675';x.beginPath();x.arc(o.x,o.y,18,0,6.28);x.fill()});shots.forEach(function(q){x.fillStyle='#ffe35a';x.beginPath();x.arc(q.x,q.y,5,0,6.28);x.fill()});
x.fillStyle='#39a9ff';x.beginPath();x.arc(p.x,p.y,20,0,6.28);x.fill();
document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp));document.getElementById('xp').textContent=xp;document.getElementById('el').textContent=el;requestAnimationFrame(loop)}
</script></body></html>
